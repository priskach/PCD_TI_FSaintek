# Template gitbook-docs.yaml — fill in the placeholders below with your
# repository's REAL directories. Do not invent content directories that
# don't exist; delete any section/space you don't need.
#
# Schema reference: https://api.gitbook.com/gitbook-docs.yaml
#
# Key rules to keep in mind while filling this in:
# - Every `key` must be unique across the whole file (any node type).
# - If you use ANY section, every space must live inside a section —
#   none can sit at the top level, and exactly one section needs
#   `default: true`.
# - If you have NO sections, list spaces directly at the root, and
#   exactly one of them needs `default: true`.
# - Each section marks exactly one of its child spaces `default: true`.
# - `content.directory` must point to a real folder in this repo,
#   relative to the repo root (e.g. `./docs/guides` or `/guides`).
# - Two spaces can share the same `content.directory` only if they
#   declare the same `content.language`.

$schema: https://api.gitbook.com/gitbook-docs.yaml
version: 1

site:
  title: "<SITE TITLE>"          # e.g. "PCD_TI_FSaintek Docs"
  structure:

    # ---- Option A: sections (use this OR the flat list below, not both) ----
    - type: section
      key: section-<slug>         # e.g. section-guides
      title: "<SECTION TITLE>"
      path: <section-path>        # e.g. guides
      default: true                # exactly one section needs this
      children:
        - type: space
          key: space-<slug>       # e.g. space-getting-started
          title: "<SPACE TITLE>"
          path: <space-path>      # e.g. getting-started
          default: true            # exactly one space per section needs this
          content:
            directory: ./<real-directory-path>   # must exist in the repo

        # - type: space
        #   key: space-<slug-2>
        #   title: "<SPACE TITLE 2>"
        #   path: <space-path-2>
        #   content:
        #     directory: ./<real-directory-path-2>

    # - type: section
    #   key: section-<slug-2>
    #   title: "<SECTION TITLE 2>"
    #   path: <section-path-2>
    #   children:
    #     - type: space
    #       key: space-<slug-3>
    #       title: "<SPACE TITLE 3>"
    #       path: <space-path-3>
    #       default: true
    #       content:
    #         directory: ./<real-directory-path-3>

    # ---- Option B: flat spaces, no sections (delete Option A if using this) ----
    # - type: space
    #   key: space-<slug>
    #   title: "<SPACE TITLE>"
    #   path: <space-path>
